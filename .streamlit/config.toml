[server]
address = "127.0.0.1"
port = 8501
headless = true
enableCORS = true
corsAllowedOrigins = ["http://127.0.0.1:8501", "http://localhost:8501"]
allowedHosts = ["127.0.0.1", "localhost"]
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#6366f1"
backgroundColor = "#0b0f19"
secondaryBackgroundColor = "#111827"
textColor = "#f9fafb"
font = "sans serif"

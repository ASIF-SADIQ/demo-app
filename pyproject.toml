[project]
name = "calculator"
version = "0.1.0"
description = "FX Scientific Pro - Keyboard-First Calculator"
readme = "README.md"
authors = [
    { name = "Muhammad Asif Sadiq", email = "asifsadiq488@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "streamlit>=1.38.0",
    "sympy>=1.13.0",
]

[project.scripts]
calculator = "calculator:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
